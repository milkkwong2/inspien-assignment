listen=YES
listen_ipv6=NO
background=NO
seccomp_sandbox=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES

# 업로드한 파일은 읽기 전용으로 만든다. 같은 이름으로 다시 STOR하면 열 수 없어 실패한다 (덮어쓰기 불가 재현).
local_umask=022
file_open_mode=0444

# 제공 환경 권한 재현: 목록 조회와 신규 업로드만 허용한다.
# 다운로드(RETR), 삭제(DELE), 이름 변경(RNFR/RNTO), 이어 쓰기(APPE), 디렉토리 생성·삭제(MKD/RMD), SITE는 없다.
cmds_allowed=USER,PASS,SYST,FEAT,OPTS,PWD,CWD,CDUP,TYPE,MODE,STRU,PASV,EPSV,PORT,EPRT,LIST,NLST,STOR,NOOP,QUIT

# 한글 파일명: Alpine의 vsftpd는 utf8_filesystem 옵션을 지원하지 않는다.
# 파일명 바이트는 그대로 저장되므로 클라이언트가 UTF-8로 보내면 UTF-8 이름이 된다 (OPTS UTF8 ON에는 200으로 응답).

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

xferlog_enable=YES
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log
