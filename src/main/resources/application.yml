# 공통 설정. 접속 대상은 프로필로 고른다.
#   local    : 로컬 컨테이너 (compose.yaml). 값은 저장소에 있다.
#   provided : 과제 제공 환경. config/의 부트스트랩 결과 파일을 그대로 읽는다 (D-23).
# 프로필 없이 실행하면 지원자 키·이름이 없어 기동에 실패한다. 제공 환경(운영)에 실수로 붙지 않게 하려는 것이다 (D-11).
spring:
  application:
    name: inspien-assignment
  jpa:
    open-in-view: false
  task:
    scheduling:
      # 영수증·배송·마감에 하나씩. 느린 FTP가 배송과 마감을 붙잡지 않는다 (D-12, D-26)
      pool:
        size: 3
      thread-name-prefix: scheduler-

app:
  oracle:
    # 기본값이 무한 대기이거나 너무 길어 장애가 "끝없이" 멈춤으로 바뀌는 곳만 정한다 (D-19)
    connect-timeout: 3s
    read-timeout: 10s
    # 접속 타임아웃(3초)보다 길어야 빈 풀에서 새 연결을 맺을 수 있다
    pool-wait: 5s
  order-db:
    # 공용 계정이라 작게, 고정 크기 (D-19). 동시 수신 2~3 + 스케줄러 3(셋 다 이 DB를 읽음) + 조회 1 (D-26)
    pool-size: 7
  shipment-db:
    pool-size: 2
  history-db:
    path: ./data/history
  inbound:
    # 송신자는 인코딩을 밝히지 않고 EUC-KR로 보낸다. EUC-KR 계열은 MS949로 읽는다 (D-20)
    default-charset: EUC-KR
    duplicate-window: 1m
    lock-stripes: 16
    # 평소 처리(1초 미만)보다 충분히 길게. 넘으면 503 BUSY로 재전송을 받는다 (D-16, D-19)
    lock-wait: 10s
    # VARCHAR2(100 BYTE), DB 문자셋 AL32UTF8: 제공 환경에서 확인했다 (설계서 §11.1)
    db-charset: UTF-8
    max-value-bytes: 100
    # 본문 상한. 넘으면 H2에 저장하기 전에 413으로 거절한다. 샘플 63건이 몇 KB라 1MB면 수천 건 묶음도 받는다
    max-body-size: 1MB
  ftp:
    connect-timeout: 5s
    command-timeout: 30s
    data-timeout: 30s
    # 한글 파일명은 UTF-8: 제공 환경의 기존 파일명과 FEAT UTF8로 확인했다 (설계서 §11.1)
    filename-encoding: UTF-8
  scheduler:
    enabled: true
    # 가장 짧은 백오프(1분)보다 짧아야 백오프가 의도대로 동작한다 (D-12)
    fixed-delay: 30s
    batch-size: 100
  retry:
    max-attempts: 5
    initial-backoff: 1m
    multiplier: 2
  receipt:
    content-charset: UTF-8
    bom: true

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-} msg=%X{messageId:-} order=%X{orderId:-}]"
