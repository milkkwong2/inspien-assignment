plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.inspien'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	// com.querydsl은 유지보수가 멈춰 Jakarta/Hibernate 7을 지원하는 OpenFeign 포크를 쓴다
	querydslVersion = '7.7'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	// FTP 클라이언트 (영수증 업로드)
	implementation 'commons-net:commons-net:3.13.0'
	// H2 내부 키 (시간순 정렬되는 13자 ID)
	implementation 'com.github.f4b6a3:tsid-creator:5.2.6'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc17'
	// 처리 이력 DB (앱 안에서 도는 파일 DB)
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// 로컬과 같은 Oracle·FTP 이미지로 통합 테스트
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-oracle-free'
	// 패키지 의존 규칙 강제
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
}

springBoot {
	mainClass = 'com.inspien.assignment.InspienAssignmentApplication'
}

// 제공 환경 읽기 전용 확인 (설계서 §11). Oracle은 SELECT만, FTP는 목록 조회만 한다. 앱의 일부가 아니라 테스트 소스에 둔다.
tasks.register('checkProvided', JavaExec) {
	group = 'verification'
	description = '제공 Oracle·FTP를 읽기 전용으로 확인한다 (config/connection.json 필요)'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.inspien.assignment.verification.ProvidedEnvironmentCheck'
	workingDir = rootDir
	jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

// 과제 API에서 DB/FTP 접속 정보를 받는 일회성 도구. Spring 애플리케이션과 별도 진입점으로 실행한다.
tasks.register('bootstrap', JavaExec) {
	group = 'application'
	description = '과제 API를 호출해 접속 정보를 받는다 (최초 1회). 복호화만 다시: --args="--decrypt-only"'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.inspien.assignment.bootstrap.BootstrapMain'
	workingDir = rootDir
	// Windows에서 콘솔 기본 인코딩(MS949)으로 출력되어 UTF-8 터미널에서 한글이 깨지는 것을 막는다
	jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}
