plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.inspien'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	// com.querydsl은 유지보수가 멈춰 Jakarta/Hibernate 7을 지원하는 OpenFeign 포크를 쓴다
	querydslVersion = '7.7'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc17'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
}

springBoot {
	mainClass = 'com.inspien.assignment.InspienAssignmentApplication'
}

// 과제 API에서 DB/FTP 접속 정보를 받는 일회성 도구. Spring 애플리케이션과 별도 진입점으로 실행한다.
tasks.register('bootstrap', JavaExec) {
	group = 'application'
	description = '과제 API를 호출해 접속 정보를 받는다 (최초 1회). 복호화만 다시: --args="--decrypt-only"'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.inspien.assignment.bootstrap.BootstrapMain'
	workingDir = rootDir
	// Windows에서 콘솔 기본 인코딩(MS949)으로 출력되어 UTF-8 터미널에서 한글이 깨지는 것을 막는다
	jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}
